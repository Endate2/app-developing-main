
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Календарь и каналы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles-chanelpage.css">
</head>
<body>
<div class="container">

  <!-- Новый блок с информацией о канале -->
  <div class="channel-info-section">
    <div class="channel-info-container">
      <div class="channel-avatar-large">
      </div>
      <div class="channel-details">
        <div class="channel-title"></div>
        <div class="channel-subscribers"></div>
      </div>
    </div>
  </div>

  <div class="content-row">
    <!-- Календарь -->
    <div class="favorites-section">
      <div class="section-title">Описание канала</div>
      <div class="channel-info-block">

        <div class="channel-meta">
          <div class="channel-description">
          </div>
        </div>
      </div>

    </div>
    <div class="calendar-section">
      <div class="section-title">Статистика канала</div>


      <div class="calendar-grid">
      </div>
    </div>
  </div>


  <!-- Блок с информацией о цене -->
  <div class="ad-price-container">
    <div class="section-title-2">Стоимость рекламы</div>

    <div class="price-item">
      <span class="price-label">Цена за пост</span>
      <span class="price-value"></span>
    </div>

    <div class="price-item">
      <span class="price-label">Длительность (указана в часах)</span>
      <span class="duration-value"></span>
    </div>

    <div class="price-item">
      <span class="price-label">Комиссия сервиса</span>
      <span class="price-value">500 ₽</span>
    </div>

    <div class="total-price"></div>

    <button id="purchase-button" class="purchase-button">Разместить рекламу</button>
  </div>


</div>

<!-- Нижняя навигация -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html">Профиль</a>
  </div>
  <div class="nav-item active">
    <a href="reklama.html">Реклама</a>
  </div>
  <div class="nav-item">
    <a href="notification.html">Уведомления</a>
  </div>
</div>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="/js/backend-payment.js"></script>

</body>
</html>
