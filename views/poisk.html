<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Channels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/styles-poisk.css">
  <style>
    .search-header {
      display: none;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    .back-button {
      font-size: 28px;
      background: none;
      border: none;
      margin-right: 15px;
      cursor: pointer;
    }

    .search-results {
      display: none;
      padding: 15px;
    }

    .no-results {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="search-header">
    <button class="back-button">‹</button>
    <div class="search-title">Поиск каналов</div>
  </div>

  <div class="header">
    <div class="mode-switcher">
      <button class="mode-button active" id="buy-mode">Купить</button>
      <button class="mode-button" id="sell-mode">Выставить</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Поиск каналов...">
  </div>

  <div class="search-results"></div>

  <div class="main-content">

    <div class="section">
      <div class="section-title">
        <span>Рекомендации</span>
      </div>
      <div class="channels-list">
        <div class="channel-card vertical">
          <div class="channel-image">🚀</div>
          <div class="channel-name">Наука и Тех</div>
          <div class="channel-stats">210K подписчиков • 25 постов в день</div>
        </div>
        <div class="channel-card vertical">
          <div class="channel-image">💰</div>
          <div class="channel-name">Инвестиции</div>
          <div class="channel-stats">185K подписчиков • 18 постов в день</div>
        </div>
        <div class="channel-card vertical">
          <div class="channel-image">🌎</div>
          <div class="channel-name">Путешествия</div>
          <div class="channel-stats">172K подписчиков • 12 постов в день</div>
        </div>
        <div class="channel-card vertical">
          <div class="channel-image">🏋️</div>
          <div class="channel-name">Фитнес</div>
          <div class="channel-stats">158K подписчиков • 15 постов в день</div>
        </div>
        <div class="channel-card vertical">
          <div class="channel-image">🎮</div>
          <div class="channel-name">Игры</div>
          <div class="channel-stats">142K подписчиков • 20 постов в день</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <a href="index.html">Профиль</a>
    </div>
    <div class="nav-item active">
      <a href="reklama.html">Реклама</a>
    </div>
    <div class="nav-item">
      <a href="notification.html">Уведомления</a>
    </div>
  </div>
</div>

<script src="/js/backend-poisk.js"></script>
</body>
</html>
