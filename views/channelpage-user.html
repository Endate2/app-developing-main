<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Календарь и каналы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles-chanelpage.css">
</head>
<body>
<div class="container">
  <div class="header">
    <div class="app-title">Информация о канале</div>
  </div>

  <!-- Новый блок с информацией о канале -->
  <div class="channel-info-section">
    <div class="channel-info-container">
      <div class="channel-avatar-large">
      </div>
      <div class="channel-details">
        <div class="channel-title"></div>
        <div class="channel-subscribers"></div>
      </div>
      <!-- Добавленная звездочка для избранного -->
      <div class="favorite-star">
        <i class="far fa-star" id="favorite-icon"></i>
      </div>
    </div>
  </div>

  <div class="content-row">
    <!-- Календарь -->
    <div class="favorites-section">
      <div class="section-title">Описание канала</div>
      <div class="channel-info-block">

        <div class="channel-meta">
          <div class="channel-description">
            Футбольные трансляции и аналитика. Лучшие моменты матчей,
            эксклюзивные интервью и прогнозы на игры.
          </div>
        </div>
      </div>

    </div>
    <div class="calendar-section">
      <div class="section-title">Статистика канала</div>


      <div class="calendar-grid">
      </div>
    </div>
  </div>

  <div class="calendar-section">
    <div class="calendar-header">
      <div class="month-year">Сентябрь 2023</div>
      <div class="nav-buttons">
        <button class="nav-button" id="prevMonth">‹</button>
        <button class="nav-button" id="nextMonth">›</button>
      </div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Популярные каналы -->
  <div class="popular-channels">
    <div class="section-title">ОСТАВИТЬ ОТЗЫВ</div>

    <div class="popular-grid">

    </div>
  </div>
</div>

<!-- Нижняя навигация -->
<div class="bottom-nav">
  <div class="nav-item">
    <a href="index.html">Профиль</a>
  </div>
  <div class="nav-item active">
    <a href="reklama.html">Реклама</a>
  </div>
  <div class="nav-item">
    <a href="history.html">Уведомления</a>
  </div>
</div>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  // Добавляем обработчик для звездочки
  document.addEventListener('DOMContentLoaded', function() {
    const favoriteIcon = document.getElementById('favorite-icon');

    favoriteIcon.addEventListener('click', function() {
      this.classList.toggle('far');
      this.classList.toggle('fas');
      this.classList.toggle('active');

      // Здесь можно добавить логику для сохранения в избранное
      const isFavorite = this.classList.contains('fas');
      console.log('Channel is now', isFavorite ? 'favorited' : 'unfavorited');
      // В будущем здесь будет вызов API для сохранения в избранное
    });
  });
</script>
<script src="/js/backend-channelpage-user.js"></script>
<script src="/kalendari/kalendari.js"></script>
</body>
</html>
