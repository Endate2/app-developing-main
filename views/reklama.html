<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <link rel="stylesheet" href="/css/styles-reklama.css">
</head>
<body>
  <div class="container">
    <!-- Хедер -->
    <div class="header">
      <div class="mode-switcher">
        <button class="mode-button" id="buy-mode">Купить</button>
        <button class="mode-button active" id="sell-mode">Выставить</button>
      </div>
    </div>

    <!-- Мои каналы -->
    <div class="channels-section">
      <div class="section-title">Мои каналы</div>
      <div id="channels-list">
        <!-- Каналы будут добавляться динамически -->
      </div>
    </div>

    <div class="add-channel-section">
      <div class="add-channel-title">Добавить канал</div>
      <div class="add-channel-description">
        Чтобы добавить канал, сделайте бота администратором вашего канала
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div class="bottom-nav">
    <div class="nav-item">
      <a href="index.html">Профиль</a>
    </div>
    <div class="nav-item active">
      <a href="reklama.html">Реклама</a>
    </div>
    <div class="nav-item">
      <a href="notification.html">Уведомления</a>
    </div>
  </div>

  <script src="/js/backend-reklama.js"></script>

</body>
</html>
